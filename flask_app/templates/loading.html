<!DOCTYPE html>
<html lang="tr" class="dark" data-bs-theme="dark" data-glass-effects="on" data-glass-quality="normal" data-kasa-background="aurora" data-kasa-motion="on" data-kasa-animations="on" data-kasa-gradient="on">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ŞifreKasam güvenli giriş ekranı hazırlanıyor.">
    <meta name="theme-color" content="#080912">
    <meta name="color-scheme" content="dark light">
    <!-- ── BU BELGEDE NASIL CSP UYGULANIR ────────────────────────────────────
         Bu dosya iki farklı bağlamda yüklenir:
           1) Ana süreç `loadFile()` ile file:// üzerinden yükler
              (src/main/page-loader.js → resolveLoadingPagePath). Bu yolda Flask
              hiç devreye girmez: ne csp_nonce üretilir ne de add_security_headers
              çalışır → sayfa BELGESİZ CSP ile açılırdı.
           2) GET /loading herkese açık uçtan Jinja ile render edilir
              (app.py: loading_page) → gerçek nonce'lu header CSP'si zaten
              uygulanmaktadır.
         Aşağıdaki meta (1) yolundaki boşluğu kapatır. (2) yolunda header ile
         KESİŞİM (intersection) uygulanır: bir politika diğerini genişletemez,
         dolayısıyla header'daki gerçek nonce zorunluluğu gevşemez.
         Ayrıntılar:
           * 'unsafe-inline' yalnızca (1) yolu için gerekli: statik dosyada nonce
             üretilemez ve sayfanın CSS'i/script'i satır içidir. (2) yolda
             header `script-src 'self' 'nonce-…'` zaten nonce'suz satır içi
             script'i bloke eder.
           * Aşağıdaki satırlardaki nonce="{{ csp_nonce }}" öznitelikleri
             BİLEREK KORUNMUŞTUR: (2) yolunda gerçek nonce'tir ve olmazsa
             header CSP inline script/style'i bloke ederdi; (1) yolunda geçersiz
             bir değer olduğu için zaten yok sayılır.
           * font-src'a eklenen `file:` yalnızca (1) yolu içindir: Chromium'da
             'self' kaynağı file:// belgelerinde belgenin kendi yoluna birebir
             eşleşir, ../static/fonts/sora.woff2 eşleşmezdi ve yazı tipi
             kesilirdi. (2) yolunda header'daki `font-src 'self' data:` ile
             kesiştiği için fazladan izin vermez.
           * frame-ancestors meta ile verilemez (Chromium meta'da yok sayar);
             (2) yolunda header'de 'none'.

         ── JİNJA BAĞIMSIZLIĞI (KRİTİK) ──────────────────────────────────────
         Bu dosya (1) yolunda DÜZ METİN olarak okunur; Jinja ÇALIŞMAZ. Bu yüzden
         satır içi script bloklarının İÇİNDE hiçbir zaman Jinja ifadesi
         olamaz — literal kalan her ifade bir JS sözdizimi hatasıdır ve bloğun
         TAMAMI çalışmaz. (Bu dosyada yaşanan: CSRF token satırı Jinja ifadesi
         olarak yazılmıştı; ilk script bloğu tümüyle ölüyordu.Tema/cam/efekt
         uygulaması ve metin çevirisi hiç çalışmıyordu.)
         Token gerekiyorsa ÖZNITELİKTEN okunur (bkz. body[data-csrf-token]);
         bir öznitelikte kalan literal Jinja zararsızdır ve görünmez.
         Asset yolları da RELATİF'tir: ../static/… her iki bağlamda da çözülür
         (paketli: backend/_internal/templates/ → backend/_internal/static/,
         geliştirme: flask_app/templates/ → flask_app/static/; Flask yolunda
         /loading → /static/…). url_for KULLANILAMAZ. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; script-src-attr 'none'; style-src-attr 'none'; img-src 'self' data: blob:; font-src 'self' data: file:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
    <title>SifreKasam</title>
    <!-- Ortak giriş kabuğu: login.html ile AYNI dosyayı kullanır. -->
    <link rel="stylesheet" href="../static/entry-shell.css?v=1">
    <style nonce="{{ csp_nonce }}" id="loading-runtime-styles"></style>
    <script nonce="{{ csp_nonce }}">
        // file:// yolunda Flask yok → sunucuya gidecek istek yok; dil seçimi
        // yalnız localStorage'a yazılır. (2) yolunda ayrıca sunucuya da yazılır.
        const IS_FILE_BOOT = window.location.protocol === 'file:';

        // Bu blok <head> içinde çalışır; <body> henüz parse edilmemiştir, bu
        // yüzden token EAGER okunamaz — çağrıldığı anda alınır.
        function csrfToken() {
            return document.body ? (document.body.dataset.csrfToken || '') : '';
        }

        const copy = {
            tr: {
                language: 'Dil',
                languageName: 'Türkçe',
                title: 'Kasa',
                preparing: 'Giriş hazırlanıyor…',
                pageTitle: 'ŞifreKasam - Yükleniyor',
            },
            en: {
                language: 'Language',
                languageName: 'English',
                title: 'Vault',
                preparing: 'Preparing sign-in…',
                pageTitle: 'SifreKasam - Loading',
            },
        };

        const normalizeLanguage = (value) => copy[value] ? value : 'tr';

        const normalizeHex = (value, fallback = '#7c6ff7') => {
            const raw = String(value || '').trim();
            const hex = raw.startsWith('#') ? raw : '#' + raw;
            return /^#[0-9a-fA-F]{6}$/.test(hex) ? hex.toLowerCase() : fallback;
        };

        const hexToRgb = (hex) => {
            const clean = normalizeHex(hex).slice(1);
            return [
                parseInt(clean.slice(0, 2), 16),
                parseInt(clean.slice(2, 4), 16),
                parseInt(clean.slice(4, 6), 16),
            ].join(', ');
        };

        const mixColor = (hex, targetHex = '#38bdf8', amount = 0.45) => {
            const first = normalizeHex(hex).slice(1);
            const second = normalizeHex(targetHex, '#38bdf8').slice(1);
            const channel = (start, end) =>
                Math.round(start + (end - start) * amount).toString(16).padStart(2, '0');
            return '#' + channel(parseInt(first.slice(0, 2), 16), parseInt(second.slice(0, 2), 16))
                + channel(parseInt(first.slice(2, 4), 16), parseInt(second.slice(2, 4), 16))
                + channel(parseInt(first.slice(4, 6), 16), parseInt(second.slice(4, 6), 16));
        };

        function applyLanguage(value) {
            const language = normalizeLanguage(value);
            const selected = copy[language];
            document.documentElement.lang = language;
            document.title = selected.pageTitle || 'ŞifreKasam - Yükleniyor';
            document.querySelectorAll('[data-i18n]').forEach((node) => {
                node.textContent = selected[node.dataset.i18n] || node.textContent;
            });
            document.querySelectorAll('[data-entry-language]').forEach((button) => {
                const isActive = button.dataset.entryLanguage === language;
                button.classList.toggle('is-active', isActive);
                button.setAttribute('aria-selected', String(isActive));
            });
            document.querySelector('.loading-language-trigger')?.setAttribute(
                'aria-label',
                `${selected.language}: ${selected.languageName}`,
            );
            localStorage.setItem('kasa-lang', language);
        }

        function setLanguage(value) {
            const language = normalizeLanguage(value);
            applyLanguage(language);
            document.querySelector('.loading-language-select')?.classList.remove('is-open');
            document.querySelector('.loading-language-trigger')?.setAttribute('aria-expanded', 'false');
            if (IS_FILE_BOOT) return;
            fetch('/settings/language', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken() },
                body: JSON.stringify({ language }),
            }).catch(() => {});
        }

        function applyAppearance(params) {
            const storedThemeMode = params.get('themeMode') || localStorage.getItem('kasa-theme-mode');
            const systemDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');
            let themeMode = ['light', 'dark', 'system'].includes(storedThemeMode) ? storedThemeMode : 'dark';
            const theme = themeMode === 'system'
                ? (systemDarkQuery.matches ? 'dark' : 'light')
                : (themeMode === 'light' ? 'light' : 'dark');
            const glass = (params.get('glassEffects') || localStorage.getItem('kasa-glass-effects')) === 'off' ? 'off' : 'on';
            const qualityValue = params.get('glassQuality') || localStorage.getItem('kasa-glass-quality');
            const glassQuality = ['low', 'normal', 'high'].includes(qualityValue) ? qualityValue : 'normal';
            const motion = (params.get('motion') || localStorage.getItem('kasa-animated-backgrounds')) === 'off' ? 'off' : 'on';
            const animations = (params.get('animations') || localStorage.getItem('kasa-interface-animations')) === 'off' ? 'off' : 'on';
            const gradients = (params.get('gradients') || localStorage.getItem('kasa-gradients')) === 'off' ? 'off' : 'on';
            const accent = normalizeHex(params.get('accent') || localStorage.getItem('kasa-accent'));
            const accent2 = mixColor(accent);
            const backgroundValue = params.get('background') || localStorage.getItem('kasa-background');
            const background = ['aurora', 'midnight', 'mesh', 'plain'].includes(backgroundValue)
                ? backgroundValue
                : 'aurora';

            document.documentElement.setAttribute('data-bs-theme', theme);
            document.documentElement.setAttribute('data-glass-effects', glass);
            document.documentElement.setAttribute('data-glass-quality', glassQuality);
            document.documentElement.setAttribute('data-kasa-background', background);
            document.documentElement.setAttribute('data-kasa-motion', motion);
            document.documentElement.setAttribute('data-kasa-animations', animations);
            document.documentElement.setAttribute('data-kasa-gradient', gradients);
            document.getElementById('loading-runtime-styles').textContent = `html:root {
                --accent: ${accent};
                --accent-2: ${accent2};
                --accent-rgb: ${hexToRgb(accent)};
                --accent-2-rgb: ${hexToRgb(accent2)};
            }`;

            localStorage.setItem('kasa-theme', theme);
            localStorage.setItem('kasa-glass-effects', glass);
            localStorage.setItem('kasa-glass-quality', glassQuality);
            localStorage.setItem('kasa-animated-backgrounds', motion);
            localStorage.setItem('kasa-interface-animations', animations);
            localStorage.setItem('kasa-gradients', gradients);
            localStorage.setItem('kasa-accent', accent);
            localStorage.setItem('kasa-background', background);
        }

        function transitionToApp() {
            document.body?.classList.add('kasa-exit');
            const animationsEnabled = document.documentElement.dataset.kasaAnimations !== 'off'
                && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            return new Promise((resolve) => setTimeout(resolve, animationsEnabled ? 220 : 20));
        }

        try {
            const params = new URLSearchParams(location.search);
            const language = normalizeLanguage(params.get('lang') || localStorage.getItem('kasa-lang'));
            applyAppearance(params);

            document.addEventListener('DOMContentLoaded', () => {
                applyLanguage(language);

                const select = document.querySelector('.loading-language-select');
                const trigger = document.querySelector('.loading-language-trigger');
                trigger?.addEventListener('click', () => {
                    const isOpen = select?.classList.toggle('is-open') === true;
                    trigger.setAttribute('aria-expanded', String(isOpen));
                });
                document.querySelectorAll('[data-entry-language]').forEach((button) => {
                    button.addEventListener('click', () => setLanguage(button.dataset.entryLanguage));
                });
                document.addEventListener('click', (event) => {
                    if (select?.contains(event.target)) return;
                    select?.classList.remove('is-open');
                    trigger?.setAttribute('aria-expanded', 'false');
                });
                document.addEventListener('keydown', (event) => {
                    if (event.key !== 'Escape') return;
                    select?.classList.remove('is-open');
                    trigger?.setAttribute('aria-expanded', 'false');
                    trigger?.focus();
                });

                if (params.get('redirect')) {
                    setTimeout(async () => {
                        await transitionToApp();
                        window.location.replace('/?entry=loading');
                    }, 520);
                }
            });
        } catch (_) {
        }
    </script>
    <style nonce="{{ csp_nonce }}">
        /* Yalnız SAYFA düzeyi kurallar. Kabuğun kendisi (mark, başlık, kart,
           dil seçici, alt bilgi, pending çubuğu) static/entry-shell.css'te —
           login.html ile paylaşılır. */

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #080912;
            --bg-2: #131527;
            --surface: rgba(255, 255, 255, 0.05);
            --text: #e8eaf2;
            --text-muted: #8b92a5;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #7c6ff7;
            --accent-2: #38bdf8;
            --accent-rgb: 124, 111, 247;
            --accent-2-rgb: 56, 189, 248;
            --success: #22c55e;
            /* entry-shell.css bu iki değişkeni kullanır; tokens.css yüklenmediği
               için burada takma ad tanımlıyoruz. */
            --glass-border: rgba(255, 255, 255, 0.10);
            --glass-blur: blur(26px) saturate(1.12);
        }

        [data-bs-theme="light"] {
            --bg: #eef2ff;
            --bg-2: #ffffff;
            --surface: rgba(255, 255, 255, 0.68);
            --text: #172033;
            --text-muted: #475467;
            --border: rgba(31, 41, 55, 0.10);
            --glass-border: rgba(31, 41, 55, 0.12);
        }

        [data-glass-quality="low"] { --glass-blur: blur(12px) saturate(1.02); }
        [data-glass-quality="high"] { --glass-blur: blur(34px) saturate(1.18); }

        @font-face {
            font-family: 'Sora';
            font-style: normal;
            font-weight: 300 700;
            src: url('../static/fonts/sora.woff2') format('woff2');
            font-display: swap;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow: auto;
            color: var(--text);
            background: var(--bg);
            font-family: 'Sora', system-ui, sans-serif;
        }

        button {
            font: inherit;
        }

        button:focus-visible {
            outline: 2px solid rgba(var(--accent-rgb), 0.86);
            outline-offset: 2px;
        }

        /* Sayfa arka planı: kullanıcının seçtiği tema. Kabuk bunun üstünde
           durur; dekoratif ızgara/parıltı katmanı BİLEREK YOK. */
        .entry-shell-wrap {
            background: linear-gradient(160deg, var(--bg), var(--bg-2));
        }

        [data-kasa-background="midnight"] .entry-shell-wrap {
            background: linear-gradient(160deg, #050713, #101326 58%, #060816);
        }

        [data-kasa-background="mesh"] .entry-shell-wrap {
            background:
                radial-gradient(circle at 12% 20%, rgba(var(--accent-rgb), 0.16), transparent 38%),
                radial-gradient(circle at 90% 10%, rgba(var(--accent-2-rgb), 0.13), transparent 38%),
                linear-gradient(160deg, #080912, #111827);
        }

        [data-kasa-background="plain"] .entry-shell-wrap,
        [data-kasa-gradient="off"] .entry-shell-wrap {
            background: var(--bg);
        }

        [data-kasa-animations="off"] *,
        [data-kasa-animations="off"] *::before,
        [data-kasa-animations="off"] *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body data-csrf-token="{{ csrf_token|default('') }}">
    <div class="entry-shell-wrap">
        <main class="entry-shell" aria-labelledby="loading-title">
            <header class="entry-shell-head">
                <div class="entry-shell-mark" aria-hidden="true">
                    <svg class="entry-icon" viewBox="0 0 24 24">
                        <path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4V7Zm3 9.7V19h-2v-2.3a2 2 0 1 1 2 0Z"/>
                    </svg>
                </div>
                <div class="entry-shell-heading">
                    <h1 id="loading-title" class="entry-shell-title" data-i18n="title">Kasa</h1>
                </div>
                <div class="entry-language-box">
                    <span data-i18n="language">Dil</span>
                    <div class="loading-language-select">
                        <button class="loading-language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                            <span data-i18n="languageName">Türkçe</span>
                            <svg class="entry-icon" viewBox="0 0 20 20" aria-hidden="true">
                                <path d="m5.5 7.5 4.5 4 4.5-4 1.4 1.5-5.9 5.2L4.1 9l1.4-1.5Z"/>
                            </svg>
                        </button>
                        <div class="loading-language-menu" role="listbox" aria-label="Language">
                            <button type="button" role="option" data-entry-language="tr" aria-selected="true">Türkçe</button>
                            <button type="button" role="option" data-entry-language="en" aria-selected="false">English</button>
                        </div>
                    </div>
                </div>
            </header>

            <div class="entry-shell-body">
                <div class="entry-shell-pending" role="status" aria-live="polite">
                    <div class="entry-shell-pending-bar" aria-hidden="true"></div>
                    <p class="entry-shell-pending-text" data-i18n="preparing">Giriş hazırlanıyor…</p>
                </div>
            </div>
        </main>
    </div>
    <!-- Liquid Glass — saf CSS backdrop blur (GPU-uyumlu). YOL GÖRELİ: bu
         dosya file:// üzerinden de açılır, Jinja tabanlı yönlendirme çalışmaz. -->
    <script nonce="{{ csp_nonce }}" src="../static/liquid-glass.js?v=5" defer></script>
</body>
</html>
