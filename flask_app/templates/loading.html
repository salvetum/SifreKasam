<!DOCTYPE html>
<html lang="tr" class="dark" data-bs-theme="dark" data-glass-effects="on" data-glass-quality="normal" data-kasa-background="aurora" data-kasa-motion="on" data-kasa-animations="on" data-kasa-gradient="on">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ŞifreKasam güvenli giriş ekranı hazırlanıyor.">
    <meta name="theme-color" content="#080912">
    <meta name="color-scheme" content="dark light">
    <title>SifreKasam</title>
    <style nonce="{{ csp_nonce }}" id="loading-runtime-styles"></style>
    <script nonce="{{ csp_nonce }}">
        const copy = {
            tr: {
                language: 'Dil',
                languageName: 'Türkçe',
                title: 'Kasa',
                subtitle: 'Ana şifrenizle kilidi açın. Kasa yerel olarak çalışır; kapı açılana kadar sırlarınız görünmez.',
                cardTitle: 'Kilidi Aç',
                cardSubtitle: 'Ana şifrenizle devam edin.',
                preparing: 'Giriş hazırlanıyor…',
                status: 'Güvenli oturum başlatılıyor',
                pageTitle: 'ŞifreKasam - Yükleniyor',
            },
            en: {
                language: 'Language',
                languageName: 'English',
                title: 'Vault',
                subtitle: 'Unlock it with your master password. The vault runs locally; your secrets stay hidden until the door opens.',
                cardTitle: 'Unlock',
                cardSubtitle: 'Continue with your master password.',
                preparing: 'Preparing sign-in…',
                status: 'Starting secure session',
                pageTitle: 'SifreKasam - Loading',
            },
        };

        const normalizeLanguage = (value) => copy[value] ? value : 'tr';

        const normalizeHex = (value, fallback = '#7c6ff7') => {
            const raw = String(value || '').trim();
            const hex = raw.startsWith('#') ? raw : '#' + raw;
            return /^#[0-9a-fA-F]{6}$/.test(hex) ? hex.toLowerCase() : fallback;
        };

        const hexToRgb = (hex) => {
            const clean = normalizeHex(hex).slice(1);
            return [
                parseInt(clean.slice(0, 2), 16),
                parseInt(clean.slice(2, 4), 16),
                parseInt(clean.slice(4, 6), 16),
            ].join(', ');
        };

        const mixColor = (hex, targetHex = '#38bdf8', amount = 0.45) => {
            const first = normalizeHex(hex).slice(1);
            const second = normalizeHex(targetHex, '#38bdf8').slice(1);
            const channel = (start, end) =>
                Math.round(start + (end - start) * amount).toString(16).padStart(2, '0');
            return '#' + channel(parseInt(first.slice(0, 2), 16), parseInt(second.slice(0, 2), 16))
                + channel(parseInt(first.slice(2, 4), 16), parseInt(second.slice(2, 4), 16))
                + channel(parseInt(first.slice(4, 6), 16), parseInt(second.slice(4, 6), 16));
        };

        function applyLanguage(value) {
            const language = normalizeLanguage(value);
            const selected = copy[language];
            document.documentElement.lang = language;
            document.title = selected.pageTitle || 'ŞifreKasam - Yükleniyor';
            document.querySelectorAll('[data-i18n]').forEach((node) => {
                node.textContent = selected[node.dataset.i18n] || node.textContent;
            });
            document.querySelectorAll('[data-entry-language]').forEach((button) => {
                const isActive = button.dataset.entryLanguage === language;
                button.classList.toggle('is-active', isActive);
                button.setAttribute('aria-selected', String(isActive));
            });
            document.querySelector('.loading-language-trigger')?.setAttribute(
                'aria-label',
                `${selected.language}: ${selected.languageName}`,
            );
            localStorage.setItem('kasa-lang', language);
        }

        function setLanguage(value) {
            const language = normalizeLanguage(value);
            applyLanguage(language);
            document.querySelector('.loading-language-select')?.classList.remove('is-open');
            document.querySelector('.loading-language-trigger')?.setAttribute('aria-expanded', 'false');
            fetch('/settings/language', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ language }),
            }).catch(() => {});
        }

        function applyAppearance(params) {
            const storedThemeMode = params.get('themeMode') || localStorage.getItem('kasa-theme-mode');
            const systemDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');
            let themeMode = ['light', 'dark', 'system'].includes(storedThemeMode) ? storedThemeMode : 'dark';
            const theme = themeMode === 'system'
                ? (systemDarkQuery.matches ? 'dark' : 'light')
                : (themeMode === 'light' ? 'light' : 'dark');
            const glass = (params.get('glassEffects') || localStorage.getItem('kasa-glass-effects')) === 'off' ? 'off' : 'on';
            const qualityValue = params.get('glassQuality') || localStorage.getItem('kasa-glass-quality');
            const glassQuality = ['low', 'normal', 'high'].includes(qualityValue) ? qualityValue : 'normal';
            const motion = (params.get('motion') || localStorage.getItem('kasa-animated-backgrounds')) === 'off' ? 'off' : 'on';
            const animations = (params.get('animations') || localStorage.getItem('kasa-interface-animations')) === 'off' ? 'off' : 'on';
            const gradients = (params.get('gradients') || localStorage.getItem('kasa-gradients')) === 'off' ? 'off' : 'on';
            const accent = normalizeHex(params.get('accent') || localStorage.getItem('kasa-accent'));
            const accent2 = mixColor(accent);
            const backgroundValue = params.get('background') || localStorage.getItem('kasa-background');
            const background = ['aurora', 'midnight', 'mesh', 'plain'].includes(backgroundValue)
                ? backgroundValue
                : 'aurora';

            document.documentElement.classList.toggle('dark', theme !== 'light');
            document.documentElement.setAttribute('data-bs-theme', theme);
            document.documentElement.setAttribute('data-glass-effects', glass);
            document.documentElement.setAttribute('data-glass-quality', glassQuality);
            document.documentElement.setAttribute('data-kasa-background', background);
            document.documentElement.setAttribute('data-kasa-motion', motion);
            document.documentElement.setAttribute('data-kasa-animations', animations);
            document.documentElement.setAttribute('data-kasa-gradient', gradients);
            document.getElementById('loading-runtime-styles').textContent = `html:root {
                --accent: ${accent};
                --accent-2: ${accent2};
                --accent-rgb: ${hexToRgb(accent)};
                --accent-2-rgb: ${hexToRgb(accent2)};
            }`;

            localStorage.setItem('kasa-theme', theme);
            localStorage.setItem('kasa-glass-effects', glass);
            localStorage.setItem('kasa-glass-quality', glassQuality);
            localStorage.setItem('kasa-animated-backgrounds', motion);
            localStorage.setItem('kasa-interface-animations', animations);
            localStorage.setItem('kasa-gradients', gradients);
            localStorage.setItem('kasa-accent', accent);
            localStorage.setItem('kasa-background', background);
        }

        function transitionToApp() {
            document.body?.classList.add('kasa-exit');
            const animationsEnabled = document.documentElement.dataset.kasaAnimations !== 'off'
                && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            return new Promise((resolve) => setTimeout(resolve, animationsEnabled ? 260 : 20));
        }

        try {
            const params = new URLSearchParams(location.search);
            const language = normalizeLanguage(params.get('lang') || localStorage.getItem('kasa-lang'));
            applyAppearance(params);

            document.addEventListener('DOMContentLoaded', () => {
                applyLanguage(language);

                const select = document.querySelector('.loading-language-select');
                const trigger = document.querySelector('.loading-language-trigger');
                trigger?.addEventListener('click', () => {
                    const isOpen = select?.classList.toggle('is-open') === true;
                    trigger.setAttribute('aria-expanded', String(isOpen));
                });
                document.querySelectorAll('[data-entry-language]').forEach((button) => {
                    button.addEventListener('click', () => setLanguage(button.dataset.entryLanguage));
                });
                document.addEventListener('click', (event) => {
                    if (select?.contains(event.target)) return;
                    select?.classList.remove('is-open');
                    trigger?.setAttribute('aria-expanded', 'false');
                });
                document.addEventListener('keydown', (event) => {
                    if (event.key !== 'Escape') return;
                    select?.classList.remove('is-open');
                    trigger?.setAttribute('aria-expanded', 'false');
                    trigger?.focus();
                });

                if (params.get('redirect')) {
                    setTimeout(async () => {
                        await transitionToApp();
                        window.location.replace('/?entry=loading');
                    }, 520);
                }
            });
        } catch (_) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <style nonce="{{ csp_nonce }}">
        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #080912;
            --bg-2: #131527;
            --surface: rgba(255,255,255,0.05);
            --text: #e8eaf2;
            --text-muted: #8b92a5;
            --border: rgba(255,255,255,0.08);
            --accent: #7c6ff7;
            --accent-2: #38bdf8;
            --accent-rgb: 124, 111, 247;
            --accent-2-rgb: 56, 189, 248;
            --success: #22c55e;
            --entry-blur: blur(32px) saturate(1.18);
            --card-blur: blur(18px);
        }

        [data-bs-theme="light"] {
            --bg: #eef2ff;
            --bg-2: #ffffff;
            --surface: rgba(255,255,255,0.68);
            --text: #172033;
            --text-muted: #475467;
            --border: rgba(31,41,55,0.10);
        }

        [data-glass-quality="low"] {
            --entry-blur: blur(14px) saturate(1.04);
            --card-blur: blur(6px);
        }

        [data-glass-quality="high"] {
            --entry-blur: blur(40px) saturate(1.22);
            --card-blur: blur(24px);
        }

        @font-face {
            font-family: 'Sora';
            font-style: normal;
            font-weight: 300 700;
            src: url('../static/fonts/sora.woff2') format('woff2');
            font-display: swap;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            color: var(--text);
            background: var(--bg);
            font-family: 'Sora', system-ui, sans-serif;
        }

        button {
            font: inherit;
        }

        button:focus-visible {
            outline: 2px solid rgba(var(--accent-rgb), 0.86);
            outline-offset: 2px;
        }

        .loading-sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .entry-login-wrap {
            width: 100%;
            min-height: 100vh;
            padding: clamp(1rem, 3vw, 2rem);
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
        }

        .entry-login-wrap::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 18% 12%, rgba(var(--accent-rgb), 0.34), transparent 34%),
                radial-gradient(circle at 84% 84%, rgba(var(--accent-2-rgb), 0.22), transparent 38%),
                linear-gradient(145deg, var(--bg), var(--bg-2));
        }

        .entry-login-wrap::after {
            content: '';
            position: fixed;
            inset: -2px;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(circle at center, black, transparent 76%);
            animation: loadingGridDrift 12s linear infinite;
        }

        [data-kasa-background="midnight"] .entry-login-wrap::before {
            background:
                radial-gradient(circle at 50% -10%, rgba(var(--accent-rgb), 0.22), transparent 38%),
                linear-gradient(145deg, #050713, #101326 58%, #060816);
        }

        [data-kasa-background="mesh"] .entry-login-wrap::before {
            background:
                radial-gradient(circle at 12% 20%, rgba(var(--accent-rgb), 0.30), transparent 34%),
                radial-gradient(circle at 90% 10%, rgba(var(--accent-2-rgb), 0.24), transparent 34%),
                radial-gradient(circle at 70% 90%, rgba(34,197,94,0.14), transparent 36%),
                linear-gradient(145deg, #080912, #111827);
        }

        [data-kasa-background="plain"] .entry-login-wrap::before,
        [data-kasa-gradient="off"] .entry-login-wrap::before {
            background: var(--bg);
        }

        [data-kasa-background="plain"] .entry-login-wrap::after,
        [data-kasa-gradient="off"] .entry-login-wrap::after,
        [data-glass-effects="off"] .entry-login-wrap::after {
            display: none;
        }

        [data-kasa-motion="off"] .entry-login-wrap::after {
            animation: none;
        }

        @keyframes loadingGridDrift {
            from { transform: translate3d(0, 0, 0); }
            to { transform: translate3d(0, 48px, 0); }
        }

        .entry-login-shell {
            position: relative;
            z-index: 1;
            width: min(980px, calc(100vw - 2rem));
            min-height: 540px;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 34px;
            background:
                radial-gradient(circle at 12% 0%, rgba(var(--accent-rgb), 0.16), transparent 36%),
                linear-gradient(145deg, rgba(16,19,38,0.68), rgba(255,255,255,0.035));
            box-shadow:
                0 34px 110px rgba(0,0,0,0.38),
                inset 0 1px 0 rgba(255,255,255,0.13);
            backdrop-filter: var(--entry-blur);
            -webkit-backdrop-filter: var(--entry-blur);
            animation: entryIn 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .entry-login-shell::before {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            pointer-events: none;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.17), transparent 30%),
                radial-gradient(circle at 86% 16%, rgba(var(--accent-2-rgb),0.16), transparent 34%);
            mask-image: linear-gradient(#000, transparent 72%);
        }

        [data-glass-effects="off"] .entry-login-shell {
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            background: var(--surface);
        }

        @keyframes entryIn {
            from { opacity: 0; transform: translateY(14px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .entry-login-info,
        .entry-login-panel {
            position: relative;
            z-index: 1;
        }

        .entry-login-info {
            min-height: 540px;
            padding: clamp(2rem, 5vw, 3rem);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 2.5rem;
        }

        .entry-login-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .entry-language-box {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            color: rgba(238,242,255,0.82);
            font-size: 0.78rem;
        }

        .entry-language-box {
            padding: 0.25rem 0.35rem 0.25rem 0.75rem;
        }

        [data-bs-theme="light"] .entry-language-box {
            color: var(--text);
            border-color: var(--border);
            background: rgba(255,255,255,0.72);
        }

        .entry-icon {
            width: 1em;
            height: 1em;
            display: block;
            fill: currentColor;
        }

        .loading-language-select {
            position: relative;
        }

        .loading-language-trigger {
            min-width: 116px;
            min-height: 30px;
            padding: 0.25rem 0.35rem 0.25rem 0.55rem;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 26px;
            align-items: center;
            gap: 0.25rem;
            border: 0;
            border-radius: 999px;
            color: var(--text);
            background: transparent;
            cursor: pointer;
        }

        .loading-language-trigger span {
            overflow: hidden;
            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.76rem;
            font-weight: 700;
        }

        .loading-language-trigger .entry-icon {
            width: 0.72rem;
            margin: auto;
            transition: transform 180ms ease;
        }

        .loading-language-select.is-open .loading-language-trigger {
            background: rgba(var(--accent-rgb), 0.12);
        }

        .loading-language-select.is-open .loading-language-trigger .entry-icon {
            transform: rotate(180deg);
        }

        .loading-language-menu {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            z-index: 10;
            min-width: 144px;
            padding: 0.35rem;
            display: grid;
            gap: 0.25rem;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 14px;
            background: rgba(15,18,35,0.96);
            box-shadow: 0 18px 48px rgba(0,0,0,0.34);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px) scale(0.98);
            transform-origin: top right;
            transition:
                opacity 160ms ease,
                visibility 0s linear 160ms,
                transform 160ms cubic-bezier(0.16,1,0.3,1);
        }

        .loading-language-select.is-open .loading-language-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            transition-delay: 0s;
        }

        .loading-language-menu button {
            padding: 0.6rem 0.7rem;
            border: 0;
            border-radius: 10px;
            color: var(--text-muted);
            background: transparent;
            text-align: left;
            cursor: pointer;
        }

        .loading-language-menu button:hover,
        .loading-language-menu button.is-active {
            color: var(--text);
            background: rgba(var(--accent-rgb),0.14);
        }

        .entry-login-mark {
            width: 88px;
            height: 88px;
            display: grid;
            place-items: center;
            border-radius: 28px;
            color: #fff;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.24), transparent),
                linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 22px 54px rgba(var(--accent-rgb),0.34);
        }

        .entry-login-mark .entry-icon {
            width: 2.15rem;
            height: 2.15rem;
        }

        .entry-login-title {
            margin: 1.5rem 0 0;
            color: var(--text);
            font-size: clamp(2.6rem, 7vw, 4.9rem);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -0.08em;
            text-shadow: 0 10px 34px rgba(0,0,0,0.26);
        }

        .entry-login-copy {
            max-width: 430px;
            margin: 1.2rem 0 0;
            color: rgba(226,232,240,0.86);
            font-size: 0.98rem;
            font-weight: 500;
            line-height: 1.75;
        }

        [data-bs-theme="light"] .entry-login-copy {
            color: var(--text-muted);
        }

        .entry-login-panel {
            padding: clamp(1.6rem, 4vw, 2.5rem);
            display: grid;
            place-items: center;
            border-left: 1px solid rgba(255,255,255,0.14);
            background:
                radial-gradient(circle at top right, rgba(var(--accent-rgb),0.18), transparent 42%),
                rgba(255,255,255,0.035);
        }

        .entry-login-card {
            width: min(360px, 100%);
            padding: 1.8rem;
            border: 1px solid rgba(255,255,255,0.20);
            border-radius: 28px;
            background:
                radial-gradient(circle at 12% 0%, rgba(var(--accent-rgb),0.16), transparent 38%),
                rgba(255,255,255,0.12);
            box-shadow:
                0 22px 64px rgba(0,0,0,0.22),
                inset 0 1px 0 rgba(255,255,255,0.10);
            backdrop-filter: var(--card-blur);
            -webkit-backdrop-filter: var(--card-blur);
        }

        [data-glass-effects="off"] .entry-login-card {
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            background:
                radial-gradient(circle at 12% 0%, rgba(var(--accent-rgb),0.12), transparent 38%),
                rgba(20,24,43,0.98);
        }

        [data-bs-theme="light"] .entry-login-card,
        [data-bs-theme="light"][data-glass-effects="off"] .entry-login-card {
            border-color: var(--border);
            background: rgba(255,255,255,0.82);
        }

        .entry-login-card-title {
            margin: 0 0 0.25rem;
            color: var(--text);
            font-size: 1.2rem;
            font-weight: 800;
        }

        .entry-login-card-subtitle {
            margin: 0 0 1.25rem;
            color: rgba(226,232,240,0.78);
            font-size: 0.82rem;
            font-weight: 500;
        }

        [data-bs-theme="light"] .entry-login-card-subtitle {
            color: var(--text-muted);
        }

        .loading-card-body {
            transition:
                opacity 220ms ease,
                transform 220ms cubic-bezier(0.16,1,0.3,1);
        }

        .loading-field,
        .loading-submit {
            width: 100%;
            min-height: 48px;
            display: grid;
            place-items: center;
            border-radius: 14px;
        }

        .loading-field {
            margin-bottom: 1rem;
            border: 1px solid rgba(255,255,255,0.20);
            color: rgba(248,250,252,0.46);
            background: rgba(255,255,255,0.13);
            font-size: 1.1rem;
            letter-spacing: 0.18em;
        }

        .loading-submit {
            grid-auto-flow: column;
            justify-content: center;
            gap: 0.65rem;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 12px 30px rgba(var(--accent-rgb),0.26);
            font-size: 0.86rem;
            font-weight: 750;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.38);
            border-top-color: #fff;
            border-radius: 50%;
            animation: loadingSpin 760ms linear infinite;
        }

        .loading-status {
            margin: 1rem 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.72rem;
        }

        .loading-status::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 14px rgba(34,197,94,0.55);
            animation: loadingPulse 1.1s ease-in-out infinite alternate;
        }

        @keyframes loadingSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes loadingPulse {
            from { opacity: 0.45; transform: scale(0.86); }
            to { opacity: 1; transform: scale(1); }
        }

        body.kasa-exit .loading-card-body {
            opacity: 0;
            transform: translateY(-4px);
        }

        body.kasa-exit .entry-login-shell {
            box-shadow:
                0 28px 92px rgba(0,0,0,0.34),
                inset 0 1px 0 rgba(255,255,255,0.13);
            transition: box-shadow 240ms ease;
        }

        @media (max-width: 820px) {
            body {
                overflow: auto;
            }

            .entry-login-shell {
                grid-template-columns: 1fr;
            }

            .entry-login-info {
                min-height: auto;
                padding: 1.75rem;
            }

            .entry-login-panel {
                border-top: 1px solid var(--border);
                border-left: 0;
            }
        }

        @media (min-width: 1280px) {
            .entry-login-shell {
                width: min(1120px, calc(100vw - 4rem));
                min-height: min(620px, calc(100vh - 4rem));
            }
        }

        @media (max-height: 720px) and (min-width: 821px) {
            .entry-login-wrap {
                padding: 1rem;
            }

            .entry-login-shell {
                min-height: min(540px, calc(100vh - 2rem));
            }

            .entry-login-info {
                min-height: auto;
                gap: 1.35rem;
                padding: 1.75rem;
            }

            .entry-login-mark {
                width: 74px;
                height: 74px;
                border-radius: 24px;
            }
        }

        [data-kasa-animations="off"] *,
        [data-kasa-animations="off"] *::before,
        [data-kasa-animations="off"] *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="entry-login-wrap">
        <main class="entry-login-shell" aria-labelledby="loading-title">
            <section class="entry-login-info" aria-label="ŞifreKasam">
                <div class="entry-login-top">
                    <div class="entry-language-box">
                        <span data-i18n="language">Dil</span>
                        <div class="loading-language-select">
                            <button class="loading-language-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                                <span data-i18n="languageName">Türkçe</span>
                                <svg class="entry-icon" viewBox="0 0 20 20" aria-hidden="true">
                                    <path d="m5.5 7.5 4.5 4 4.5-4 1.4 1.5-5.9 5.2L4.1 9l1.4-1.5Z"/>
                                </svg>
                            </button>
                            <div class="loading-language-menu" role="listbox" aria-label="Language">
                                <button type="button" role="option" data-entry-language="tr" aria-selected="true">Türkçe</button>
                                <button type="button" role="option" data-entry-language="en" aria-selected="false">English</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="entry-login-mark" aria-hidden="true">
                        <svg class="entry-icon" viewBox="0 0 24 24">
                            <path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-7-2a2 2 0 1 1 4 0v2h-4V7Zm3 9.7V19h-2v-2.3a2 2 0 1 1 2 0Z"/>
                        </svg>
                    </div>
                    <h1 id="loading-title" class="entry-login-title" data-i18n="title">Kasa</h1>
                    <p class="entry-login-copy" data-i18n="subtitle">
                        Ana şifrenizle kilidi açın. Kasa yerel olarak çalışır; kapı açılana kadar sırlarınız görünmez.
                    </p>
                </div>
            </section>

            <section class="entry-login-panel" aria-labelledby="loading-card-title">
                <div class="entry-login-card" role="status" aria-live="polite">
                    <div class="loading-card-body">
                        <h2 id="loading-card-title" class="entry-login-card-title" data-i18n="cardTitle">Kilidi Aç</h2>
                        <p class="entry-login-card-subtitle" data-i18n="cardSubtitle">Ana şifrenizle devam edin.</p>
                        <div class="loading-field" aria-hidden="true">••••••••••••</div>
                        <div class="loading-submit" aria-hidden="true">
                            <span class="loading-spinner"></span>
                            <span data-i18n="preparing">Giriş hazırlanıyor…</span>
                        </div>
                        <p class="loading-status" data-i18n="status">Güvenli oturum başlatılıyor</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <!-- Liquid Glass refraction (kube.io tekniği) — .entry-login-card'da,
         data-glass-quality="high" iken. -->
    <script nonce="{{ csp_nonce }}" src="{{ url_for('static', filename='liquid-glass.js') }}?v=1" defer></script>
</body>
</html>
