<section class="vault-form-panel vault-form-notes" aria-labelledby="vault-section-notes">
            <div class="vault-section-head">
                <span><i class="fa-solid fa-note-sticky"></i></span>
                <div>
                    <h2 id="vault-section-notes">{{ _('Notlar') }}</h2>
                    <p>{{ _('Ek açıklamalar ve hatırlatıcı bilgiler.') }}</p>
                </div>
            </div>

            <div class="vault-field">
                <label for="comment" id="comment_label">{{ _('Not (İsteğe Bağlı)') }}</label>
                <textarea name="comment" id="comment" rows="4" placeholder="{{ _('Notlar…') }}"
                    class="kasa-field resize-none">{{ kayit.full_data.Comment if kayit }}</textarea>
            </div>
        </section>
