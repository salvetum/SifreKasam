<!-- Ana Şifre Değiştirme Modal -->
<div class="kasa-modal" id="changePasswordModal" tabindex="-1" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="change-password-title">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="change-password-title" class="modal-title modal-title-display font-semibold">
                    <i class="fa-solid fa-shield-halved mr-2 text-[#f59e0b]"></i>{{ _('Şifreyi Değiştir') }}
                </h2>
                <button type="button" data-kasa-close class="kasa-close-btn" aria-label="{{ _('Kapat') }}">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="modal-body p-4 space-y-3">
                <form id="changePasswordForm">
                    <div class="mb-3">
                        <label class="block text-sm font-medium text-kasa-text-muted mb-1.5" for="cp-old">{{ _('Mevcut Ana Şifre') }}</label>
                        <input type="password" name="old_password" id="cp-old" required placeholder="••••••••"
                            class="w-full px-3 py-2.5 kasa-field text-sm">
                    </div>
                    <hr class="border-kasa-border my-4">
                    <div class="mb-3">
                        <label class="block text-sm font-medium text-kasa-text-muted mb-1.5" for="cp-new">{{ _('Yeni Ana Şifre') }}</label>
                        <input type="password" name="new_password" id="cp-new" required placeholder="{{ _('Yeni şifre') }}"
                            class="w-full px-3 py-2.5 kasa-field text-sm">
                    </div>
                    <div class="mb-5">
                        <label class="block text-sm font-medium text-kasa-text-muted mb-1.5" for="cp-confirm">{{ _('Yeni Şifre (Tekrar)') }}</label>
                        <input type="password" name="confirm_password" id="cp-confirm" required placeholder="{{ _('Tekrar yazın') }}"
                            class="w-full px-3 py-2.5 kasa-field text-sm">
                    </div>
                    <div id="cp-progress" class="mb-4" hidden>
                        <div class="flex justify-between text-xs text-kasa-text-muted mb-1">
                            <span>{{ _('Kayıtlar yeniden şifreleniyor…') }}</span>
                            <span id="cp-pct">0%</span>
                        </div>
                        <div class="h-2 rounded-full bg-kasa-border-hi overflow-hidden">
                            <progress id="cp-bar" class="password-change-progress" max="100" value="0"></progress>
                        </div>
                    </div>
                    <button type="submit" id="cp-submit"
                        class="w-full kasa-btn kasa-btn-primary">
                        {{ _('Şifreyi Güncelle ve Re-encrypt Et') }}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
