<!-- ── DASHBOARD BAR (yalnızca anasayfa) ─────────────────────────── -->
<div class="kasa-dashboard-bar">
    <!-- ── İSTATİSTİK SATIRI (filtre chip'leri) ──────────────────── -->
    <div class="glass rounded-xl px-4 py-2 flex flex-wrap items-center gap-y-1 stats-bar-layout" id="stats-bar">
        <button type="button" class="stats-filter-chip" data-stat-filter="all" aria-pressed="false"
                title="{{ _('Tüm kayıtları göster') }}">
            <span class="stats-icon stats-icon-accent"><i class="fa-solid fa-database"></i></span>
            <span class="font-semibold text-sm text-kasa-text" id="stat-toplam">—</span>
            <span class="text-xs text-kasa-text-muted">{{ _('kayıt') }}</span>
        </button>
        <span class="stats-separator" aria-hidden="true">|</span>
        <button type="button" class="stats-filter-chip" data-stat-filter="favorites" aria-pressed="false"
                title="{{ _('Sadece favorileri göster') }}">
            <span class="stats-icon stats-icon-warning"><i class="fa-solid fa-star"></i></span>
            <span class="font-semibold text-sm text-kasa-text" id="stat-pinned">—</span>
            <span class="text-xs text-kasa-text-muted">{{ _('favori') }}</span>
        </button>
        <span class="stats-separator" aria-hidden="true">|</span>
        <button type="button" class="stats-filter-chip" data-stat-filter="zayif" aria-pressed="false"
                title="{{ _('Zayıf şifreli kayıtları göster') }}">
            <span class="stats-icon stats-icon-danger"><i class="fa-solid fa-shield-halved"></i></span>
            <span class="font-semibold text-sm text-kasa-text" id="stat-zayif">—</span>
            <span class="text-xs text-kasa-text-muted">{{ _('zayıf') }}</span>
        </button>
        <span class="stats-separator" aria-hidden="true">|</span>
        <button type="button" class="stats-filter-chip" data-stat-filter="eski" aria-pressed="false"
                title="{{ _('Eski şifreli kayıtları göster') }}">
            <span class="stats-icon stats-icon-info"><i class="fa-solid fa-clock"></i></span>
            <span class="font-semibold text-sm text-kasa-text" id="stat-eski">—</span>
            <span class="text-xs text-kasa-text-muted">{{ _('eski') }}</span>
        </button>
        <span class="stats-separator" aria-hidden="true">|</span>
        <button type="button" class="stats-filter-chip" data-stat-filter="expired" aria-pressed="false"
                title="{{ _('Süresi dolmuş kayıtları göster') }}">
            <span class="stats-icon stats-icon-danger"><i class="fa-solid fa-calendar-xmark"></i></span>
            <span class="font-semibold text-sm text-kasa-text" id="stat-expired">—</span>
            <span class="text-xs text-kasa-text-muted">{{ _('süresi doldu') }}</span>
        </button>
    </div>

    <!-- Alt satır: Seçim + Filtre + Arama -->
    <div class="flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-2 flex-wrap">
            <div class="flex flex-wrap gap-1.5" id="category-filter" role="group" aria-label="{{ _('Kayıt filtreleri') }}">
            <button type="button" data-filter="all"
                class="filter-btn filter-btn-active active" aria-pressed="true">{{ _('Tümü') }}</button>
            <button type="button" data-filter="favorites"
                class="filter-btn" aria-pressed="false"><i class="fa-solid fa-star"></i> {{ _('Favori') }}</button>
            <button type="button" data-filter="Website"
                class="filter-btn" aria-pressed="false"><i class="fa-solid fa-globe"></i> {{ _('Web') }}</button>
            <button type="button" data-filter="Application"
                class="filter-btn" aria-pressed="false"><i class="fa-solid fa-desktop"></i> {{ _('Uygulama') }}</button>
            <button type="button" data-filter="CreditCard"
                class="filter-btn" aria-pressed="false"><i class="fa-solid fa-credit-card"></i> {{ _('Kart') }}</button>
            <button type="button" data-filter="SecureNote"
                class="filter-btn" aria-pressed="false"><i class="fa-solid fa-note-sticky"></i> {{ _('Not') }}</button>
            <button type="button" data-filter="Other"
                class="filter-btn" aria-pressed="false"><i class="fa-solid fa-folder"></i> {{ _('Diğer') }}</button>
        </div>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0" id="bulk-and-search-group">
            <label class="bulk-select-all-control flex items-center gap-2 text-xs text-kasa-text-muted cursor-pointer select-none whitespace-nowrap" id="select-all-label" for="select-all" hidden>
                <input type="checkbox" id="select-all" class="bulk-select-checkbox">
                {{ _('Tümünü seç') }}
            </label>
            <button type="button" id="bulk-toggle-btn" title="{{ _('Toplu Seç') }}" aria-pressed="false"
                class="kasa-btn kasa-btn-muted kasa-transition-fast">
                <i class="fa-solid fa-check-square"></i> {{ _('Toplu Seç') }}
            </button>
            <div class="record-search-wrap">
                <label for="search-input" class="sr-only">{{ _('Kayıt ara') }}</label>
                <input type="text" id="search-input" placeholder="{{ _('Arama yap…') }}" autocomplete="off"
                    class="w-full px-3 py-2 kasa-field text-sm">
            </div>
        </div>
    </div>
</div>
